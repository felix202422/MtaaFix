name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  JAVA_VERSION: '25'
  NODE_VERSION: '22'
  MVN_OPTS: '-Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.client=warn'

jobs:
  release:
    name: Build jar + web distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build and test backend jar
        run: mvn -B -f backend/pom.xml package $MVN_OPTS

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web distribution
        working-directory: web
        run: npm ci && npm run build

      - name: Zip web distribution
        run: cd web/dist && zip -r "$GITHUB_WORKSPACE/web-dist.zip" .

      - name: Create GitHub Release with artifacts
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            backend/target/mtaafix-*.jar
            web-dist.zip
