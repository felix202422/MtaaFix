name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '25'
  NODE_VERSION: '22'
  MVN_OPTS: '-Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.client=warn'

jobs:
  backend:
    name: Backend (H2 + PostgreSQL/PostGIS)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: mtaafix
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mtaafix"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MTAAFIX_PG_IT: 'true'
      # Default-profile context for the PG IT: needs a >=32-char JWT secret
      # (JwtTokenProvider) - the service password matches the app default.
      JWT_SECRET: 'mtaafix-ci-integration-jwt-secret-2026-0123456789abc'
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Unit + integration tests (H2 + PostgreSQL/PostGIS)
        run: mvn -B -f backend/pom.xml test $MVN_OPTS

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Lint, typecheck, tests, production build
        working-directory: web
        run: npm run lint && npm run test && npm run build

  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze
        working-directory: mobile
        run: flutter analyze

      - name: Tests
        working-directory: mobile
        run: |
          EXIT=0
          flutter test --reporter json > test-results.json 2> test-stderr.log || EXIT=$?
          node -e '
          const fs=require("fs");
          const names={};const failures=[];
          let raw="";try{raw=fs.readFileSync("test-results.json","utf8")}catch(e){}
          for(const line of raw.split("\n")){
            if(!line.startsWith("{"))continue;
            let e;try{e=JSON.parse(line)}catch(e){continue}
            if(e.type==="testStart")names[e.test.id]=e.test.name;
            if(e.type==="testDone"&&e.result!=="success"&&!e.hidden)failures.push(names[e.testID]||("#"+e.testID));
          }
          let out="### Flutter test results\n\nFailed: "+failures.length+"\n\n";
          for(const f of failures){out+="- "+f.name+"\n";console.log("::error title=Flutter test failed::"+f.name);}
          try{fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,out)}catch(e){}
          console.log("Parsed failing tests: "+failures.length);
          '
          if [ "$EXIT" -ne 0 ]; then
            echo "--- flutter test stderr tail ---"
            tail -n 80 test-stderr.log
          fi
          exit $EXIT

  secrets:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
