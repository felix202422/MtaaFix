spring:
  datasource:
    url: jdbc:h2:mem:mtaafix;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    open-in-view: false
  flyway:
    enabled: false
jwt:
  secret: min-32-char-secret-restart-2026-more
  access-token-expiration: 900000
  refresh-token-expiration: 604800000
