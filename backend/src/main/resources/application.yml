server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain

spring:
  application:
    name: mtaafix
  servlet:
    multipart:
      max-file-size: ${SPRING_MULTIPART_MAX_FILE_SIZE:21MB}
      max-request-size: ${SPRING_MULTIPART_MAX_REQUEST_SIZE:25MB}
      file-size-threshold: 0
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mtaafix?currentSchema=public&ssl=false}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:change-me}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
  mail:
    host: ${SPRING_MAIL_HOST:}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
  cache:
    type: caffeine
    caffeine:
      spec: expireAfterWrite=60s

jwt:
  secret: ${JWT_SECRET:min-32-char-secret}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:900000}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Phase 16 (SECURITY_STANDARDS): brute-force protection. Per-IP fixed
# one-minute windows on POST /auth/* and report creation; 429 + Retry-After.
rate-limit:
  enabled: ${RATE_LIMIT_ENABLED:true}
  auth-per-minute: ${RATE_LIMIT_AUTH_PER_MINUTE:30}
  report-per-minute: ${RATE_LIMIT_REPORT_PER_MINUTE:20}

# Phase 17 (NFR-7): request timing — WARN above threshold; always logged.
timing:
  warn-threshold-ms: ${TIMING_WARN_THRESHOLD_MS:500}

media:
  max-file-size-bytes: ${MEDIA_MAX_FILE_SIZE_BYTES:20971520}
  max-per-report: ${MEDIA_MAX_PER_REPORT:10}
  storage-dir: ${MEDIA_STORAGE_DIR:./uploads}

# Phase 13: notification channels (FR-6.3/6.4). Email is OFF by default -
# deliveries are recorded as SKIPPED until an SMTP provider is configured.
notifications:
  email:
    enabled: ${NOTIFICATIONS_EMAIL_ENABLED:false}
    from: ${NOTIFICATIONS_EMAIL_FROM:no-reply@mtaafix.local}
    starttls: ${NOTIFICATIONS_EMAIL_STARTTLS:true}
    max-attempts: ${NOTIFICATIONS_EMAIL_MAX_ATTEMPTS:3}
    retry-interval-ms: ${NOTIFICATIONS_EMAIL_RETRY_INTERVAL_MS:300000}
    retry-initial-delay-ms: ${NOTIFICATIONS_EMAIL_RETRY_INITIAL_DELAY_MS:60000}
  push:
    enabled: ${NOTIFICATIONS_PUSH_ENABLED:false}
  web-base-url: ${NOTIFICATIONS_WEB_BASE_URL:http://localhost:5173}


# Public location generalization (FR-11.4): deterministic HMAC offset per report.
# Production MUST set GEO_FUZZ_SECRET to a stable secret value.
geo:
  fuzz-secret: ${GEO_FUZZ_SECRET:mtaafix-local-dev-geo-fuzz-secret}
  fuzz-min-meters: ${GEO_FUZZ_MIN_METERS:150}
  fuzz-max-meters: ${GEO_FUZZ_MAX_METERS:600}

logging:
  level:
    com.mtaafix: ${LOGGING_LEVEL_COM_MTAAFIX:INFO}
    org.springframework.security: WARN

# Phase 16 deployment review: SMTP is intentionally unconfigured while the
# email channel is off - the mail health indicator would otherwise mark the
# whole app DOWN. Re-enable automatically together with the channel.
management:
  health:
    mail:
      enabled: ${NOTIFICATIONS_EMAIL_ENABLED:false}
