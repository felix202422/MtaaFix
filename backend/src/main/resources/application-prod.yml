# Phase 18 (deployment readiness): production profile.
# Real secrets are intentionally NOT defined here - ProdSecretsGuard fails
# startup while JWT_SECRET, SPRING_DATASOURCE_PASSWORD or GEO_FUZZ_SECRET
# are blank or still hold shipped development defaults. Provide them via the
# environment (runbook: docs/operations/DEPLOYMENT.md).

server:
  # Behind the terminating proxy, honour X-Forwarded-* headers so redirects
  # and the per-IP rate limiter see the real client address (B-16.4).
  forward-headers-strategy: framework

spring:
  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate validates it on startup.
      ddl-auto: validate

management:
  # Health on the app port for probes; /actuator/prometheus also exposed
  # (Phase 19 owner decision 2026-10-23: same port + nginx allowlist - the
  # runbook's nginx example denies it from public networks). Details stay off.
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never

logging:
  # Phase 19: structured JSON logs in production - one event per line,
  # MDC fields (requestId) become JSON keys for log aggregation.
  structured:
    format:
      console: logstash
